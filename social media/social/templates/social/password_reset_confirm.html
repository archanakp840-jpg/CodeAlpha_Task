{% extends 'social/base.html' %}
{% block auth_content %}<div class="auth-shell"><section class="auth-card"><h1>Choose a new password</h1><form method="post" class="stack-form">{% csrf_token %}{% for field in form %}<label class="field">{{ field.label }}{{ field }}{% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}</label>{% endfor %}<button class="button primary wide" type="submit">Update password</button></form></section></div>{% endblock %}
